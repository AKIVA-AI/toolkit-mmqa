name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - run: pip install -e ".[dev]"
    - run: pytest --cov=src --cov-report=xml -v
    - uses: codecov/codecov-action@v7
      if: matrix.python-version == '3.11'

  test-core:
    # The core package must work with no optional dependencies installed;
    # tests that need an extra skip themselves.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: pip install -e . pytest
    - run: pytest -q -rs

  action:
    # Smoke test of the composite GitHub Action in action.yml.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Write a tiny train/test split with one leaked question
      run: |
        mkdir -p smoke
        q='A robe takes 2 bolts of blue fiber and half that much white fiber. How many bolts in total does it take?'
        clean='A clean evaluation question that is not in training.'
        echo "{\"question\": \"Unrelated training question about apples and pears?\"}" > smoke/train.jsonl
        echo "{\"question\": \"Copied: $q\"}" >> smoke/train.jsonl
        echo "{\"question\": \"$q\"}" > smoke/test.jsonl
        echo "{\"question\": \"$clean\"}" >> smoke/test.jsonl
        echo "{\"question\": \"$clean\"}" > smoke/clean.jsonl
    - name: Contaminated split fails the gate
      id: leaked
      continue-on-error: true
      uses: ./
      with:
        args: contamination --train smoke/train.jsonl --eval smoke/test.jsonl --field question
        extras: ""
        report: smoke/leaked.json
    - name: Clean split passes
      id: clean
      uses: ./
      with:
        args: contamination --train smoke/train.jsonl --eval smoke/clean.jsonl --field question
        extras: fast
        report: smoke/clean.json
    - name: Check verdicts
      env:
        LEAKED: ${{ steps.leaked.outputs.verdict }}
        LEAKED_OUTCOME: ${{ steps.leaked.outcome }}
        CLEAN: ${{ steps.clean.outputs.verdict }}
      run: |
        test "$LEAKED" = "fail"
        test "$LEAKED_OUTCOME" = "failure"
        test "$CLEAN" = "pass"
        test -s smoke/leaked.json

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    # Upgrade the runner's preinstalled pip/setuptools so pip-audit reports on
    # this project's dependencies, not on stale tooling in the hosted image.
    - run: python -m pip install --upgrade pip setuptools
    - run: pip install bandit pip-audit
    - run: pip install -e ".[signing,image,audio,fast,hf]"
    - run: bandit -r src/
    - name: Audit dependencies, every optional extra included
      run: pip-audit --skip-editable

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - run: pip install -e ".[dev]"
    - run: ruff check src/ tests/
    - run: pyright src/

  sbom:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Syft
      run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
    - name: Generate SBOM (CycloneDX)
      run: syft dir:. --output cyclonedx-json=sbom.cdx.json
    - name: Install Grype
      run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
    - name: Scan for vulnerabilities
      run: grype sbom:sbom.cdx.json --fail-on critical
    - name: Upload SBOM artifact
      uses: actions/upload-artifact@v7
      with:
        name: sbom
        path: sbom.cdx.json

  build:
    name: Build and check package
    runs-on: ubuntu-latest
    needs: [test, test-core, security, lint, sbom]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Build the sdist and wheel
      run: |
        python -m pip install --upgrade pip build "twine>=6.1"
        python -m build
    - name: Check the metadata (twine 6.1+ reads Metadata 2.4)
      run: twine check --strict dist/*
    - name: Install the wheel in a clean environment
      run: |
        python -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
        "$RUNNER_TEMP/venv/bin/toolkit-mmqa" --help > /dev/null

  all-checks:
    if: always()
    needs: [test, test-core, action, security, lint, sbom, build]
    runs-on: ubuntu-latest
    steps:
    - name: Check all jobs
      run: |
        if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
          echo "One or more jobs failed"
          exit 1
        fi
        echo "All checks passed"
