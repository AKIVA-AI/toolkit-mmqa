[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit-mmqa"
dynamic = ["version"]
description = "Dataset pre-flight QA gate: train/eval and benchmark contamination, record and file dedup, image and audio checks, with a signable in-toto report."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AKIVA AI, LLC" }]
keywords = [
  "dataset", "qa", "contamination", "benchmark", "deduplication", "near-duplicate",
  "minhash", "perceptual-hash", "llm", "evaluation", "in-toto", "attestation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AKIVA-AI/toolkit-mmqa"
Documentation = "https://github.com/AKIVA-AI/toolkit-mmqa#readme"
Repository = "https://github.com/AKIVA-AI/toolkit-mmqa"
Issues = "https://github.com/AKIVA-AI/toolkit-mmqa/issues"
Changelog = "https://github.com/AKIVA-AI/toolkit-mmqa/blob/main/CHANGELOG.md"

[project.scripts]
toolkit-mmqa = "toolkit_mmqa.cli:main"

[project.optional-dependencies]
signing = [
  "cryptography>=41.0.0",
]
image = [
  "pillow>=9.1",
]
audio = [
  "soundfile>=0.12",
]
fast = [
  "numpy>=1.22",
]
hf = [
  "datasets>=2.14",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "pyright>=1.1.380",
  "cryptography>=41.0.0",
  "jsonschema>=4.18",
  "pillow>=9.1",
  "imagehash>=4.3",
  "soundfile>=0.12",
  "numpy>=1.22",
  "datasets>=2.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["toolkit_mmqa"]
omit = ["*/toolkit_mmqa/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["toolkit_mmqa"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "toolkit_mmqa._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toolkit_mmqa = ["py.typed"]
